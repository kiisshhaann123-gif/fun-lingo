<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8fd3ff" />
  <title>Fun Lingo</title>
  <!-- installable app: opens full screen and sideways from the home screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FUN LINGO" />
  <link rel="stylesheet" href="css/app.css?v=36" />
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js",
        "three/addons/": "./lib/three/addons/"
      }
    }
  </script>
</head>
<body>
  <!-- 3D scene (loading page) -->
  <canvas id="scene"></canvas>

  <!-- Loading bar: no words, just colour and a moving star -->
  <div id="loader" aria-hidden="true">
    <div class="track">
      <div class="fill"></div>
      <div class="star"></div>
    </div>
  </div>

  <!-- Appears when everything has loaded -->
  <button id="play" class="hidden" aria-label="Play">
    <span class="icon"><span class="tri"></span></span>
    <span class="greet"></span>
  </button>

  <!-- home page buttons: always in the same places -->
  <div id="home-ui" class="hidden">
    <button id="btn-parent" class="hbtn small" aria-label="Grown-ups">
      <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="#fff"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#fff" stroke-width="2.4"/></svg>
      <span class="ring"></span>
    </button>
    <button id="btn-pets" class="hbtn" aria-label="Pets">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5" ry="4" fill="#fff"/><circle cx="6" cy="10.5" r="2.1" fill="#fff"/><circle cx="18" cy="10.5" r="2.1" fill="#fff"/><circle cx="9.3" cy="6.6" r="2.1" fill="#fff"/><circle cx="14.7" cy="6.6" r="2.1" fill="#fff"/></svg>
    </button>
    <button id="btn-start" class="hbtn big" aria-label="Start lesson">
      <svg viewBox="0 0 24 24"><path d="M8.5 5.5v13l10-6.5z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-stories" class="hbtn" aria-label="Stories">
      <svg viewBox="0 0 24 24"><path d="M3 5.5c3-1.2 6-1 9 1v13c-3-2-6-2.2-9-1z" fill="#fff"/><path d="M21 5.5c-3-1.2-6-1-9 1v13c3-2 6-2.2 9-1z" fill="#fff" opacity=".85"/></svg>
    </button>
  </div>

  <!-- languages, swiped sideways under the globe -->
  <div id="lang-row" class="hidden"></div>

  <!-- lesson screen: way home + the bar towards the next pet -->
  <div id="lesson-ui" class="hidden">
    <button id="btn-exit" class="hbtn small" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10.5V20h11v-9.5" fill="#fff"/></svg>
    </button>
    <div class="unit-bar"><div class="unit-fill"></div><div class="unit-gift"></div></div>
  </div>

  <!-- lesson map: 20 picture stops on a winding path -->
  <div id="map-ui" class="hidden">
    <svg class="map-path" preserveAspectRatio="none"></svg>
    <div class="map-track"></div>
    <button class="hbtn small map-home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10.5V20h11v-9.5" fill="#fff"/></svg>
    </button>
  </div>

  <!-- a bouncing finger: "tap here" -->
  <div id="tap-hint" class="hidden" aria-hidden="true">
    <svg viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v17l3-1c3 0 5 2 5 5v1l3-1c3 0 5 2 5 5v1l2-1c3 0 5 2 5 5v8c0 8-6 14-14 14h-6c-5 0-9-2-12-6L12 41c-2-2-2-5 0-7 2-2 5-2 7 0l2 2V11c0-3 2-5 5-5z" fill="#fff" stroke="#3a3f58" stroke-width="3.5" stroke-linejoin="round" transform="rotate(180 32 32)"/></svg>
    <span class="ripple"></span>
  </div>

  <!-- lesson finished: stars, the unit's 20 dots, home or next -->
  <div id="lesson-done" class="hidden">
    <div class="done-card">
      <div class="done-stars"><i></i><i></i><i></i></div>
      <div class="done-dots"></div>
      <div class="done-buttons">
        <button id="btn-done-home" class="done-btn home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10.5V20h11v-9.5" fill="#fff"/></svg></button>
        <button id="btn-done-next" class="done-btn next" aria-label="Next lesson"><svg viewBox="0 0 24 24"><path d="M8.5 5.5v13l10-6.5z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>

  <!-- temporary parent setup: which language the child learns -->
  <div id="lang-picker" class="hidden"></div>

  <!-- iPhone / iPad: how to get full screen (shown once, for parents) -->
  <div id="ios-hint" class="hidden">
    <button class="ios-close" aria-label="Close">×</button>
    <div class="ios-row">
      <span class="ios-step"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" fill="none" stroke="#2f7bff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 11H5v10h14V11h-1" fill="none" stroke="#2f7bff" stroke-width="2.2" stroke-linejoin="round"/></svg></span>
      <span class="ios-arrow">→</span>
      <span class="ios-step"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="#2b2150" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="#2b2150" stroke-width="2.2" stroke-linecap="round"/></svg></span>
      <span class="ios-arrow">→</span>
      <img src="icons/apple-touch-icon.png" alt="" class="ios-app" />
    </div>
    <p>Tap <b>Share</b>, then <b>Add to Home Screen</b> to play in full screen.</p>
  </div>

  <div id="fade"></div>

  <!-- phones held upright: ask (with a picture, no words) to turn the phone sideways -->
  <div id="rotate" aria-hidden="true"><div class="phone"></div></div>

  <script type="module" src="js/main.js?v=36"></script>
</body>
</html>
