# Builds the FUN Lingo Android app (a test APK) from the www folder.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['www/**', 'app-android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu machines already include the Android SDK (ANDROID_HOME);
      # just make sure its licences are accepted so Gradle can fetch what it needs.
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        run: npm install

      - name: Put the app (www) inside and create the Android project
        run: |
          rm -rf www android
          cp -r ../www ./www
          npx cap add android
          npx cap sync android

      - name: Image tool for the icon and splash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Full screen, sideways only, app icon and splash
        run: |
          RES=android/app/src/main/res
          # our MainActivity (hides the bars, lets audio play)
          cp MainActivity.java android/app/src/main/java/com/funlingo/app/MainActivity.java
          # landscape only
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          # app icon: use our picture at every size (and drop the default adaptive icon)
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            convert ../www/icons/icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            convert ../www/icons/icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_round.png
            convert ../www/icons/icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_foreground.png
          done
          # splash: sky blue with our icon in the middle
          for f in $(find $RES -name 'splash.png'); do
            size=$(identify -format '%wx%h' "$f")
            h=$(identify -format '%h' "$f"); w=$(identify -format '%w' "$f")
            m=$(( (w < h ? w : h) / 3 ))
            convert -size $size xc:'#8fd3ff' \( ../www/icons/icon-512.png -resize ${m}x${m} \) -gravity center -composite "$f"
          done
          grep -o 'android:screenOrientation="[a-zA-Z]*"' android/app/src/main/AndroidManifest.xml

      - name: Build the APK
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FUN-Lingo-debug.apk
          ls -lh ../FUN-Lingo-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FUN-Lingo-debug-apk
          path: app-android/FUN-Lingo-debug.apk
          retention-days: 30
